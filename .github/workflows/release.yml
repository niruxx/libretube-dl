name: Release Linux builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch sidecar binaries (yt-dlp, ffmpeg)
        run: ./scripts/fetch-binaries.sh

      # Tauri's bundler produces .deb, .rpm, and .AppImage from a single Linux build —
      # these package formats don't require building on Debian/Fedora/etc. themselves.
      # NO_STRIP avoids a linuxdeploy failure ("unknown type [0x13] section `.relr.dyn'")
      # on very recent glibc/binutils toolchains whose RELR relocations its bundled
      # strip predates; it only skips a size optimization, not required for the app to run.
      - name: Build app (deb, rpm, AppImage)
        run: npm run tauri build
        env:
          NO_STRIP: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
